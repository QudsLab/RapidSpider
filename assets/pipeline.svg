<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 994 230" width="994" height="230" role="img" aria-label="RapidSpider pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="994" height="230" rx="14" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<text x="30" y="40" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">What happens to every site</text>
<rect x="30" y="70" width="118" height="104" rx="12" fill="#8250df"/>
<text x="89.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">1. Your list</text>
<text x="89.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">csv · sqlite · json</text>
<line x1="150" y1="122.0" x2="164" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="166" y="70" width="118" height="104" rx="12" fill="#0969da"/>
<text x="225.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">2. Fetch</text>
<text x="225.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">http → browser →</text>
<text x="225.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">headed → tor</text>
<line x1="286" y1="122.0" x2="300" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="302" y="70" width="118" height="104" rx="12" fill="#bf8700"/>
<text x="361.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">3. Classify</text>
<text x="361.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">normal · holding ·</text>
<text x="361.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">parked · third party</text>
<line x1="422" y1="122.0" x2="436" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="438" y="70" width="118" height="104" rx="12" fill="#1a7f37"/>
<text x="497.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">4. Crawl</text>
<text x="497.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">sitemap + links,</text>
<text x="497.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">up to 4 pages</text>
<line x1="558" y1="122.0" x2="572" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="574" y="70" width="118" height="104" rx="12" fill="#0b7285"/>
<text x="633.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">5. Clean</text>
<text x="633.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">Laya keeps or</text>
<text x="633.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">drops each block</text>
<line x1="694" y1="122.0" x2="708" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="710" y="70" width="118" height="104" rx="12" fill="#cf222e"/>
<text x="769.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">6. Facts</text>
<text x="769.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">Laya picks, then</text>
<text x="769.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">re-checks 8 times</text>
<line x1="830" y1="122.0" x2="844" y2="122.0" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<rect x="846" y="70" width="118" height="104" rx="12" fill="#24292f"/>
<text x="905.0" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">7. Output</text>
<text x="905.0" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">SQLite files +</text>
<text x="905.0" y="148" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffffd9">web dashboard</text>
<text x="497.0" y="205" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Laya runs inside the program. No API keys, no separate server.</text>
</svg>