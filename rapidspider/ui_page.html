<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapidSpider</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
<style>
:root{
  --bg:#f1f3f7; --panel:#ffffff; --ink:#0f1621; --ink2:#566175; --ink3:#8792a5;
  --line:#d8dde6; --soft:#e8ebf1; --hover:#eef3fd; --blue:#026ffc; --blue-ink:#0b55c4; --blue-wash:#e4eeff;
  --side:#0f1621; --side-ink:#d5dcea; --side-dim:#7c8aa3; --side-line:#1d2839; --side-hover:#18222f;
  --ok:#0b8a5b; --warn:#a8650a; --bad:#c42f2f; --info:#0b7fa3; --mute:#6b778c;
  --sans:"Bahnschrift","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0f17; --panel:#101826; --ink:#e8ecf4; --ink2:#9aa7bd; --ink3:#6c7a92;
  --line:#223045; --soft:#182233; --hover:#13233d; --blue:#4a94ff; --blue-ink:#8bbaff; --blue-wash:#13294a;
  --side:#070b11; --side-ink:#d5dcea; --side-dim:#6c7a92; --side-line:#141c29; --side-hover:#0f1621;
  --ok:#35c58b; --warn:#e6a23c; --bad:#ff7b7b; --info:#4cc3e6; --mute:#8a96ab;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);display:grid;grid-template-columns:240px minmax(0,1fr)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue-ink)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.dim{color:var(--ink2)}.faint{color:var(--ink3)}

/* ---------- side rail ---------- */
#rail{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.brand svg{width:46px;height:auto;flex:none}
.lm-d{fill:#e8ecf4}.lm-b{fill:#4a94ff}
.brand b{font-size:18px;font-weight:700;font-style:italic;letter-spacing:-.01em;color:#e8ecf4;line-height:1.1}
.brand b i{color:#4a94ff;font-style:inherit}
.brand small{display:block;color:var(--side-dim);font-size:11.5px;font-style:normal;font-weight:400;margin-top:2px;overflow-wrap:anywhere}
.lines{margin:0 18px 8px;height:20px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.lines span{display:block;height:3px;border-radius:2px;background:#4a94ff;opacity:.28}
.lines span:nth-child(1){width:100%}.lines span:nth-child(2){width:72%}.lines span:nth-child(3){width:46%}
body[data-mode=running] .lines span{opacity:1;animation:rush 1.1s linear infinite}
body[data-mode=running] .lines span:nth-child(2){animation-delay:-.35s}
body[data-mode=running] .lines span:nth-child(3){animation-delay:-.7s}
@keyframes rush{0%{transform:translateX(-30%);opacity:.15}40%{opacity:1}100%{transform:translateX(30%);opacity:.15}}
@media (prefers-reduced-motion:reduce){body[data-mode=running] .lines span{animation:none;opacity:1}}
.group{margin:10px 0 2px;padding:0 18px;color:var(--side-dim);font-size:12px}
#rail a.nav{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 18px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
#rail a.nav:hover{background:var(--side-hover)}
#rail a.nav[aria-current=page]{background:var(--side-hover);border-left-color:var(--blue);color:#fff;font-weight:600}
#rail a.nav em{font-style:normal;color:var(--side-dim);font-size:12px;font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;padding:14px 18px;color:var(--side-dim);font-size:12px;border-top:1px solid var(--side-line);overflow-wrap:anywhere}

/* ---------- main ---------- */
#main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.015em;flex:1;min-width:140px}
#menu{display:none}
.pill{padding:2px 11px;border-radius:99px;background:var(--soft);font-weight:650;font-size:12.5px}
.pill[data-m=running]{background:#d6f3e6;color:#075f3f}.pill[data-m=paused],.pill[data-m=pausing]{background:#fbebcf;color:#7a4a05}.pill[data-m=stopping],.pill[data-m=stopped]{background:#fadada;color:#8a1f1f}
@media (prefers-color-scheme:dark){.pill[data-m=running]{background:#0f3a2b;color:#6fe0b0}.pill[data-m=paused],.pill[data-m=pausing]{background:#3b2a0c;color:#f0bd6a}.pill[data-m=stopping],.pill[data-m=stopped]{background:#401919;color:#ff9a9a}}
.btn{height:32px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.solid:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--panel);height:32px}
.step button{width:30px;height:100%;border:0;background:none;cursor:pointer;font-size:16px}
.step button:hover{color:var(--blue)}.step b{min-width:26px;text-align:center}
.page{padding:22px 24px 60px;max-width:1700px;width:100%}

/* ---------- dashboard ---------- */
.sec{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{margin:0 0 12px;font-size:14px;font-weight:650}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 40px;align-items:end}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.big span{font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:6px}
.meter{grid-column:1/-1;height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);transition:width .4s}
.facts-row{display:flex;gap:30px;flex-wrap:wrap}
.facts-row div{display:flex;flex-direction:column}.facts-row b{font-size:18px;font-weight:650}.facts-row span{color:var(--ink2);font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px}
.stack{display:flex;height:26px;border-radius:2px;overflow:hidden;background:var(--soft);margin-bottom:12px}
.stack a{display:block;height:100%;min-width:2px}
.stack a:focus-visible{outline-offset:-2px}
table{border-collapse:collapse;width:100%}
.legend td{padding:5px 8px;border-bottom:1px solid var(--soft)}
.legend tr{cursor:pointer}.legend tr:hover td{background:var(--hover)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.spark{display:block;width:100%;height:110px}
.spark rect{fill:var(--blue)}
.spark text{fill:var(--ink3);font-size:10px}
.err{color:var(--bad);font-weight:600}

/* ---------- data browser ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{height:32px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:0 10px}
.tools input[type=search]{width:min(320px,100%)}
.tools .count{margin-left:auto;color:var(--ink2)}
.grid{border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:auto;max-height:calc(100vh - 230px)}
.grid table{min-width:100%}
.grid th{position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line);padding:0;text-align:left;white-space:nowrap}
.grid th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:9px 12px;cursor:pointer;font-weight:650;color:var(--ink2)}
.grid th button:hover{color:var(--ink);background:var(--hover)}
.grid th button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.grid th[aria-sort=ascending] button,.grid th[aria-sort=descending] button{color:var(--blue-ink)}
.grid th.r button{justify-content:flex-end}
.car{width:8px;height:12px;flex:none;opacity:.25}
th[aria-sort] .car{opacity:1}
.car path{fill:currentColor}
.grid td{padding:7px 12px;border-bottom:1px solid var(--soft);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid td.wide{max-width:560px}.grid td.r{text-align:right}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr[aria-selected=true] td{background:var(--blue-wash)}
.grid tbody tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.empty{padding:36px;text-align:center;color:var(--ink2)}
.pager{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.pager .btn{height:30px;padding:0 11px}
.pager span{margin:0 8px;color:var(--ink2)}
.st{font-weight:650}
.s-ok,.s-auto_good,.s-accepted{color:var(--ok)}.s-third_party{color:var(--info)}
.s-dead,.s-blocked,.s-no_content,.s-auto_unsure,.s-warning{color:var(--warn)}
.s-error,.s-timeout,.s-laya_down,.s-auto_bad,.s-ERROR{color:var(--bad)}
.s-auto_duplicate,.s-pending{color:var(--mute)}
.conf{display:inline-flex;align-items:center;gap:7px}
.conf i{display:inline-block;width:38px;height:5px;background:var(--soft);border-radius:2px;overflow:hidden}
.conf i b{display:block;height:100%;background:var(--blue)}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(7,11,17,.45);z-index:20;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.25);transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column}
body[data-open] #drawer{transform:none}body[data-open] #scrim{display:block}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.dh h3{margin:0;font-size:16px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{padding:18px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:16px}
.kv dt,.kv dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--soft)}
.kv dt{color:var(--ink2);overflow-wrap:anywhere}.kv dd{overflow-wrap:anywhere;white-space:pre-wrap}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.quote{border-left:3px solid var(--blue);background:var(--panel);padding:10px 14px;margin:0 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:0 6px 6px 0}
.h4{font-weight:650;margin:18px 0 8px;font-size:13.5px}
.answer{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}.answer b{font-size:22px;font-weight:650}
pre{margin:0 0 16px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;font:12px/1.5 var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.tabs button{all:unset;padding:8px 14px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.tabs button:focus-visible{outline:2px solid var(--blue)}
.mini td,.mini th{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
.mini th{color:var(--ink2);font-weight:600}
.mini tr.link{cursor:pointer}.mini tr.link:hover td{background:var(--hover)}
.cat{margin-bottom:16px}.cat h5{margin:0 0 4px;font-size:13.5px}.cat p{margin:0 0 6px;padding-left:12px;border-left:2px solid var(--line)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:40;display:none}

@media (max-width:900px){
  body{grid-template-columns:1fr}
  #rail{position:fixed;z-index:30;width:250px;transform:translateX(-102%);transition:transform .18s}
  body[data-nav] #rail{transform:none}
  #menu{display:inline-block}
  .split{grid-template-columns:1fr}
  .page{padding:16px 14px 50px}.bar{padding:12px 14px}
}
</style>
</head>
<body data-mode="idle">
<nav id="rail" aria-label="Sections">
  <div class="brand"><span id="mark"></span><b>Rapid<i>Spider</i><small id="cfgname"></small></b></div>
  <div class="lines" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="navlist"></div>
  <div class="railfoot" id="railfoot"></div>
</nav>
<div id="main">
  <header class="bar">
    <button class="btn" id="menu" aria-label="Open menu">Menu</button>
    <h1 id="title">Dashboard</h1>
    <span class="pill" id="mode" data-m="idle">idle</span>
    <div class="step" role="group" aria-label="Threads"><button id="tm" aria-label="Fewer threads">−</button><b class="num" id="thr">–</b><button id="tp" aria-label="More threads">+</button></div>
    <button class="btn solid" id="bpause">Pause</button>
    <button class="btn danger" id="bstop">Stop</button>
  </header>
  <main class="page" id="view"></main>
</div>
<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dh"><h3 id="dtitle"></h3><button class="btn" id="dprev" aria-label="Previous row">Prev</button><button class="btn" id="dnext" aria-label="Next row">Next</button><button class="btn" id="dclose">Close</button></div>
  <div class="db" id="dbody"></div>
</aside>
<div id="toast" role="status"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}return r.json()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

let META={tables:[]},TBL={},ST=null,CUR=null;
const GROUPS=[['Run',[['dash','Dashboard']]],['Review',[['facts'],['laya_calls']]],['Data',[['track'],['sites'],['pages'],['profiles'],['incidents'],['logos'],['run_log']]]];
const STATUS_COL={ok:'var(--ok)',third_party:'var(--info)',dead:'#6b778c',blocked:'#d98a1e',no_content:'#e0b25a',error:'var(--bad)',timeout:'#e58a8a',laya_down:'#8e6bd1',pending:'var(--blue)'};
const fnum=n=>(n??0).toLocaleString();

/* ---------------- formatting ---------------- */
const TIME=new Set(['ts','at','created_at','finished_at','started_at','fetched_at']);
const PCT=new Set(['conf','confidence','score','laya_score']);
const BOOL=new Set(['ready','is_logo','tor_used']);
const WIDE=new Set(['text','detail','msg','title','reason','url','final_url']);
const REVIEW={auto_good:'accepted',auto_bad:'rejected',auto_unsure:'unsure',auto_duplicate:'duplicate'};
function fmtTime(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return v;return d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function fmtMs(v){return v==null?'':v>=1000?(v/1000).toFixed(1)+' s':v+' ms'}
function conf(v){if(v==null)return'';const p=Math.round(v*100);return `<span class="conf num"><i><b style="width:${p}%"></b></i>${p}%</span>`}
function cell(c,v,row){
  if(v==null||v==='')return '<span class="faint">–</span>';
  if(TIME.has(c))return E(fmtTime(v));
  if(PCT.has(c))return conf(v);
  if(c==='near_sim')return Number(v).toFixed(2);
  if(BOOL.has(c))return v?'yes':'<span class="faint">no</span>';
  if(c==='ms'||c==='elapsed_ms')return fmtMs(v);
  if(c==='review')return `<span class="st s-${E(v)}">${E(REVIEW[v]||v)}</span>`;
  if(c==='status'||c==='level'||(c==='label'&&v==='ERROR'))return `<span class="st s-${E(v)}">${E(v)}</span>`;
  if(c==='url'||c==='final_url')return E(String(v).replace(/^https?:\/\/(www\.)?/,''));
  if(c==='category')return E((META.categories[v]||{}).label||v);
  if(c==='id'||c==='site_id')return `<span class="mono">${E(v)}</span>`;
  return E(v);
}
const tbl=n=>TBL[n];
const colType=(t,c)=>(tbl(t).columns.find(x=>x.name===c)||{}).type||'TEXT';
const isNum=(t,c)=>/INT|REAL|NUM/.test(colType(t,c))&&!/(^id$|_id$)/.test(c);
const LABELS={id:'ID',site_id:'Site',final_url:'Site URL',url:'URL',ts:'Time',at:'Time',ms:'Took',elapsed_ms:'Took',conf:'Confidence',near_sim:'Similarity',near_label:'Nearest example',http_status:'HTTP',fact_count:'Facts',created_at:'Created',finished_at:'Finished',started_at:'Started',fetched_at:'Fetched',qkey:'Key',msg:'Message',done:'Done code',tor_used:'Tor',is_logo:'Saved',laya_score:'Laya score',found_emails:'Emails',found_phones:'Phones',input_url:'Input URL',review:'Verdict'};
const label=c=>LABELS[c]||c.replace(/_/g,' ').replace(/^./,x=>x.toUpperCase());

/* ---------------- router ---------------- */
function parseHash(){const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');return {path:path||'dash',p:Object.fromEntries(new URLSearchParams(qs||''))}}
function go(path,p){const q=new URLSearchParams(p||{}).toString();location.hash='#/'+path+(q?'?'+q:'')}
function setParams(upd){const {path,p}=parseHash();const n={...p,...upd};for(const k in n)if(n[k]===''||n[k]==null)delete n[k];history.replaceState(null,'','#/'+path+(Object.keys(n).length?'?'+new URLSearchParams(n):''));CUR.p=n;CUR.hash=location.hash}
window.addEventListener('hashchange',()=>{if(CUR&&CUR.hash===location.hash)return;route()});

function buildRail(){
  $('#navlist').innerHTML=GROUPS.map(([g,items])=>`<div class="group">${g}</div>`+items.map(([k,l])=>{const t=k==='dash'?null:tbl(k);return `<a class="nav" href="#/${k==='dash'?'dash':'t/'+k}" data-k="${k}"><span>${E(l||t.label)}</span>${t?`<em id="cnt-${k}">${ST?fnum(ST.tables[k]):''}</em>`:''}</a>`}).join('')).join('');
}
function markNav(k){document.querySelectorAll('#rail a.nav').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.body.removeAttribute('data-nav')}
async function route(){
  const {path,p}=parseHash();closeDrawer();const hash=location.hash;
  if(path==='dash'){CUR={kind:'dash',p,hash};markNav('dash');$('#title').textContent='Dashboard';await dash(true)}
  else if(path.startsWith('t/')&&TBL[path.slice(2)]){const n=path.slice(2);CUR={kind:'table',name:n,p,hash,rows:[],total:0,sel:-1};markNav(n);$('#title').textContent=tbl(n).label;buildTable()}
  else go('dash');
}

/* ---------------- dashboard ---------------- */
async function dash(first){
  const s=ST=await api('/api/state');applyState(s);
  const v=$('#view');
  if(first||!$('#d-big')){
    v.innerHTML=`<section class="sec"><div class="prog"><div class="big num" id="d-big"></div><div class="facts-row" id="d-facts"></div><div class="meter"><i id="d-meter"></i></div></div></section>
    <section class="sec split"><div><h2>Outcomes</h2><div class="stack" id="d-stack"></div><table class="legend"><tbody id="d-legend"></tbody></table></div>
      <div><h2>Sites finished per minute, last 20 minutes</h2><svg class="spark" id="d-spark" viewBox="0 0 400 110" preserveAspectRatio="none" role="img" aria-label="Sites finished per minute"></svg></div></section>
    <section class="sec"><h2>Working now</h2><table class="mini"><thead><tr><th>Site</th><th>Name</th><th>Stage</th><th class="r">Seconds</th></tr></thead><tbody id="d-act"></tbody></table></section>
    <section class="sec"><h2>Laya</h2><div class="dim" id="d-laya"></div></section>`}
  $('#d-big').innerHTML=`${fnum(s.done)}<span>of ${fnum(s.total)} sites this run</span>`;
  $('#d-meter').style.width=Math.min(100,100*s.done/Math.max(1,s.total))+'%';
  $('#d-facts').innerHTML=`<div><b class="num">${s.rate_per_min}</b><span>sites per minute</span></div><div><b class="num">${s.eta_min==null?'–':s.eta_min+' min'}</b><span>time left</span></div><div><b class="num">${fnum(s.queued)}</b><span>waiting</span></div><div><b class="num">${fnum(s.laya.calls)}</b><span>laya questions</span></div><div><b class="num">${s.laya.avg_ms} ms</b><span>per question</span></div>`;
  const ent=Object.entries(s.counts).sort((a,b)=>b[1]-a[1]),sum=ent.reduce((a,x)=>a+x[1],0)||1;
  $('#d-stack').innerHTML=ent.map(([k,n])=>`<a href="#/t/track?f_status=${k}" title="${k}: ${n}" style="width:${100*n/sum}%;background:${STATUS_COL[k]||'var(--mute)'}" aria-label="${k} ${n}"></a>`).join('');
  $('#d-legend').innerHTML=ent.map(([k,n])=>`<tr onclick="go('t/track',{f_status:'${k}'})"><td><span class="sw" style="background:${STATUS_COL[k]||'var(--mute)'}"></span>${E(k)}</td><td class="num" style="text-align:right">${fnum(n)}</td><td class="num dim" style="text-align:right">${(100*n/sum).toFixed(1)}%</td></tr>`).join('')||'<tr><td class="dim">Nothing finished yet.</td></tr>';
  const mx=Math.max(1,...s.throughput),w=400/20;
  $('#d-spark').innerHTML=s.throughput.map((n,i)=>{const h=n/mx*84;return `<rect x="${i*w+2}" y="${92-h}" width="${w-4}" height="${Math.max(h,n?2:0)}" rx="1"><title>${n} sites</title></rect>`}).join('')+`<text x="2" y="108">20 min ago</text><text x="398" y="108" text-anchor="end">now</text><text x="2" y="10">${mx} per min</text>`;
  $('#d-act').innerHTML=s.active.map(a=>`<tr class="link" onclick="openSite('${E(a.id)}')"><td class="mono">${E(a.id)}</td><td>${E(a.name)}</td><td>${E(a.stage)}</td><td class="num" style="text-align:right">${a.sec}</td></tr>`).join('')||'<tr><td colspan="4" class="dim">Nothing is running.</td></tr>';
  const L=s.laya;$('#d-laya').innerHTML=`Version ${E(L.version||'')} on ${E(L.device||'')}, models ${E((L.models||[]).join(', '))}. ${L.last_error?`<span class="err">Last error: ${E(L.last_error)}</span>`:'No errors.'}`;
}
function applyState(s){
  document.body.dataset.mode=s.mode;const m=$('#mode');m.textContent=s.mode;m.dataset.m=s.mode;
  $('#thr').textContent=s.threads;const paused=s.mode.startsWith('paus');$('#bpause').textContent=paused?'Resume':'Pause';
  $('#bstop').disabled=s.mode==='stopping'||s.mode==='stopped';
  for(const k in s.tables){const e=$('#cnt-'+k);if(e)e.textContent=fnum(s.tables[k])}
  $('#railfoot').textContent=(s.laya.device?`laya on ${s.laya.device}`:'');
}
async function ctl(a,v){try{await api('/api/control',{action:a,value:v});applyState(ST=await api('/api/state'))}catch(e){toast(e.message)}}
$('#bpause').onclick=()=>ctl(ST&&ST.mode.startsWith('paus')?'resume':'pause');
$('#bstop').onclick=()=>{if(confirm('Finish the sites in progress, then exit RapidSpider?'))ctl('stop')};
$('#tm').onclick=()=>ctl('threads',(ST?.threads||1)-1);$('#tp').onclick=()=>ctl('threads',(ST?.threads||1)+1);
$('#menu').onclick=()=>document.body.toggleAttribute('data-nav');

/* ---------------- data browser (every table) ---------------- */
function buildTable(){
  const n=CUR.name,t=tbl(n),p=CUR.p;
  const caret='<svg class="car" viewBox="0 0 8 12" aria-hidden="true"><path d="M4 0l4 5H0zM4 12L0 7h8z"/></svg>';
  $('#view').innerHTML=`<div class="tools"><input type="search" id="q" placeholder="Search ${E(t.label.toLowerCase())}" value="${E(p.q||'')}" aria-label="Search">
    ${t.filters.map(c=>`<select data-f="${c}" aria-label="${E(label(c))}"><option value="">${E(label(c))}: any</option></select>`).join('')}
    ${t.flags.length?`<select id="flag" aria-label="Quick filter"><option value="">All rows</option>${t.flags.map(f=>`<option ${p.flag===f?'selected':''}>${E(f)}</option>`).join('')}</select>`:''}
    <select id="size" aria-label="Rows per page">${[25,50,100,200].map(x=>`<option ${(+p.size||50)===x?'selected':''} value="${x}">${x} per page</option>`).join('')}</select>
    <span class="count num" id="cnt"></span></div>
    <div class="grid"><table><thead><tr>${t.list.map(c=>`<th data-c="${c}" class="${isNum(n,c)?'r':''}" aria-sort="${p.sort===c?(p.dir==='desc'?'descending':'ascending'):'none'}"><button title="${E(c)}, ${colType(n,c).toLowerCase()}. Click to sort.">${E(label(c))}${caret}</button></th>`).join('')}</tr></thead><tbody id="rows"></tbody></table></div>
    <div class="pager" id="pager"></div>`;
  let timer;$('#q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{setParams({q:e.target.value,page:''});loadRows()},250)};
  $('#size').onchange=e=>{setParams({size:e.target.value,page:''});loadRows()};
  if($('#flag'))$('#flag').onchange=e=>{setParams({flag:e.target.value,page:''});loadRows()};
  document.querySelectorAll('.tools select[data-f]').forEach(sel=>{const c=sel.dataset.f;
    api(`/api/distinct/${n}/${c}`).then(vals=>{sel.innerHTML+=vals.map(v=>`<option value="${E(v)}" ${String(p['f_'+c])===String(v)?'selected':''}>${E(c==='review'?(REVIEW[v]||v):v)}</option>`).join('')});
    sel.onchange=e=>{setParams({['f_'+c]:e.target.value,page:''});loadRows()}});
  document.querySelectorAll('.grid th button').forEach(b=>b.onclick=()=>{
    const c=b.parentElement.dataset.c,{sort,dir}=CUR.p;let upd;
    if(sort!==c)upd={sort:c,dir:'asc'};else if(dir!=='desc')upd={sort:c,dir:'desc'};else upd={sort:'',dir:''};
    setParams({...upd,page:''});document.querySelectorAll('.grid th').forEach(th=>th.setAttribute('aria-sort',th.dataset.c===CUR.p.sort?(CUR.p.dir==='desc'?'descending':'ascending'):'none'));loadRows()});
  loadRows();
}
async function loadRows(){
  const n=CUR.name,t=tbl(n),p=CUR.p,size=+p.size||50,page=Math.max(0,(+p.page||1)-1);
  const qs=new URLSearchParams({limit:size,offset:page*size});
  for(const k in p)if(['q','sort','dir','flag'].includes(k)||k.startsWith('f_'))qs.set(k,p[k]);
  let r;try{r=await api(`/api/table/${n}?${qs}`)}catch(e){toast(e.message);return}
  if(!CUR||CUR.name!==n)return;
  CUR.rows=r.rows;CUR.total=r.total;CUR.sel=-1;
  $('#cnt').textContent=`${fnum(r.total)} rows`;
  $('#rows').innerHTML=r.rows.map((row,i)=>`<tr tabindex="0" data-i="${i}">${t.list.map(c=>`<td class="${isNum(n,c)?'r num':''} ${WIDE.has(c)?'wide':''}" title="${['text','msg','detail','reason'].includes(c)?E(row[c]):''}">${cell(c,row[c],row)}</td>`).join('')}</tr>`).join('')||`<tr><td class="empty" colspan="${t.list.length}">No rows match. Clear the search or the filters.</td></tr>`;
  document.querySelectorAll('#rows tr[data-i]').forEach(tr=>{tr.onclick=()=>openRow(+tr.dataset.i);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openRow(+tr.dataset.i)}}});
  const pages=Math.max(1,Math.ceil(r.total/size));
  $('#pager').innerHTML=`<button class="btn" ${page<=0?'disabled':''} data-pg="${page}">Previous</button><span class="num">Page ${page+1} of ${fnum(pages)}</span><button class="btn" ${page+1>=pages?'disabled':''} data-pg="${page+2}">Next</button>`;
  document.querySelectorAll('#pager button').forEach(b=>b.onclick=()=>{setParams({page:b.dataset.pg});loadRows();$('.grid').scrollTop=0});
}

/* ---------------- drawer ---------------- */
function closeDrawer(){document.body.removeAttribute('data-open');if(CUR)CUR.sel=-1;document.querySelectorAll('#rows tr[aria-selected]').forEach(r=>r.removeAttribute('aria-selected'))}
$('#scrim').onclick=closeDrawer;$('#dclose').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(!document.body.hasAttribute('data-open'))return;if(e.key==='Escape')closeDrawer();if(e.key==='ArrowLeft'&&!e.target.closest('input'))step(-1);if(e.key==='ArrowRight'&&!e.target.closest('input'))step(1)});
function step(d){if(!CUR||CUR.kind!=='table')return;const i=CUR.sel+d;if(i>=0&&i<CUR.rows.length)openRow(i)}
$('#dprev').onclick=()=>step(-1);$('#dnext').onclick=()=>step(1);
function showDrawer(title,html,nav){$('#dtitle').textContent=title;$('#dbody').innerHTML=html;$('#dprev').style.display=$('#dnext').style.display=nav?'':'none';$('#dbody').scrollTop=0;document.body.setAttribute('data-open','')}
const kv=(pairs)=>`<dl class="kv">${pairs.map(([k,v])=>`<dt>${E(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;

async function openRow(i){
  const n=CUR.name,row=CUR.rows[i];CUR.sel=i;
  document.querySelectorAll('#rows tr').forEach(tr=>tr.toggleAttribute('aria-selected',+tr.dataset.i===i));
  $('#dprev').disabled=i<=0;$('#dnext').disabled=i>=CUR.rows.length-1;
  let full;try{full=await api(`/api/row/${n}/${row.rid}`)}catch(e){toast(e.message);return}
  if(n==='track')return openSite(full.id,true);
  if(n==='laya_calls')return drawLaya(full);
  if(n==='facts')return drawFact(full);
  showDrawer(`${tbl(n).label}`,kv(tbl(n).columns.map(c=>[label(c.name),full[c.name]==null?'<span class="faint">–</span>':(TIME.has(c.name)?E(fmtTime(full[c.name])):E(full[c.name]))])),true);
}
const CHECK_NAMES={states_fact:'states a concrete fact',specific:'specific to this business',category:'fits the category',own_claim:'the business says it about itself',complete:'complete statement',useful:'useful to a customer',clean:'free of boilerplate',true:'claim is true',matches:'page matches the claim',visitor:'a visitor would agree',evidence:'clear evidence in the text',plain:'plain reading agrees',not_ui:'real sentences, not menu text'};
const VOTE_TASKS=new Set(['fact_verify','confirm','block_recheck']);
function agrees(r){const flipped=(r.shots||'').endsWith('*');return r.label===(flipped?'B':'A')}
function voteTable(rows){if(!rows.length)return '<div class="dim">No questions logged.</div>';
  return `<table class="mini"><thead><tr><th>Check</th><th>Laya</th><th class="r">Sure</th></tr></thead><tbody>${rows.map(r=>{const nm=(r.shots||'').replace('*','');const ok=agrees(r);return `<tr><td>${E(CHECK_NAMES[nm]||nm)}</td><td><span class="st ${ok?'s-ok':'s-warn'}">${ok?'agrees':'disagrees'}</span></td><td class="num" style="text-align:right">${r.conf==null?'':Math.round(r.conf*100)+'%'}</td></tr>`}).join('')}</tbody></table>`}
async function drawLaya(r){
  const vote=VOTE_TASKS.has(r.task),ok=vote?agrees(r):null;
  let h=`<div class="answer"><b>${vote?(ok?'Agrees':'Disagrees'):E(r.label)}</b><span class="dim">${r.conf==null?'':Math.round(r.conf*100)+'% sure'}</span></div>`;
  h+=kv([['Task',E(r.task)],['When',E(fmtTime(r.ts))],['Site',r.site_id?`<a href="#/t/track" onclick="event.preventDefault();openSite('${E(r.site_id)}')">${E(r.site_id)}</a>`:'–'],['Question key',`<span class="mono">${E(r.qkey)}</span>`],['Batch',`${r.batch} question${r.batch==1?'':'s'} in ${fmtMs(r.ms)}`]]);
  h+=`<div class="h4">Text judged</div><div class="quote">${E(r.text)}</div>`;
  if(r.near_label)h+=`<div class="h4">Nearest solved example</div>${kv([['Label',E(r.near_label)],['Similarity',Number(r.near_sim).toFixed(2)],['Agreement',r.near_label===r.label?'<span class="st s-ok">same label</span>':(r.near_sim>=.8?'<span class="st s-warn">differs from a very similar example</span>':'<span class="dim">differs, but the example is not very similar</span>')]])}`;
  if(r.shots&&!vote)h+=`<div class="h4">Examples shown to laya</div><div>${E(r.shots)}</div>`;
  if(vote&&r.shots)h+=`<div class="h4">Check</div><div>${E(CHECK_NAMES[r.shots.replace('*','')]||r.shots)}${r.shots.endsWith('*')?' <span class="dim">(answer keys flipped)</span>':''}</div>`;
  if(r.prompt)h+=`<div class="h4">Prompt sent</div><pre>${E(r.prompt)}</pre>`;
  h+=`<div class="h4">Raw answer</div><pre>${E(r.answer)}</pre><div id="sib"></div>`;
  showDrawer(`${r.task} question`,h,true);
  if(r.site_id){const q=new URLSearchParams({f_site_id:r.site_id,f_task:r.task,limit:vote?40:12});if(vote)q.set('q',r.text.slice(0,50));
    try{const o=await api('/api/table/laya_calls?'+q);if(!document.body.hasAttribute('data-open'))return;
      $('#sib').innerHTML=vote?`<div class="h4">All checks on this text</div>${voteTable(o.rows)}`:`<div class="h4">Other ${E(r.task)} questions on this site</div><table class="mini"><tbody>${o.rows.map(x=>`<tr><td class="dim">${E(fmtTime(x.ts))}</td><td>${E((x.text||'').slice(0,90))}</td><td><b>${E(x.label)}</b></td></tr>`).join('')}</tbody></table>`}catch(e){}}
}
async function drawFact(r){
  const c=(META.categories[r.category]||{label:r.category});
  let h=`<div class="answer"><b>${E(c.label)}</b><span class="st s-${E(r.review)}">${E(REVIEW[r.review]||r.review||'')}</span></div>`;
  h+=`<div class="quote">${E(r.text)}</div>`;
  h+=kv([['Value',r.value?E(r.value):'–'],['Agreement',E(r.votes||'–')+(r.score!=null?` rounds, mean ${Math.round(r.score*100)}%`:'')],['Confidence',r.confidence==null?'–':Math.round(r.confidence*100)+'%'],['Found by',E(r.source)],['Page',r.url?`<a href="${E(r.url)}" target="_blank" rel="noopener">${E(r.url)}</a>`:'–'],['Site',`<a href="#/t/track" onclick="event.preventDefault();openSite('${E(r.site_id)}')">${E(r.site_id)}</a>`]]);
  h+=`<div class="h4">How laya checked it</div><div id="votes" class="dim">Loading.</div>`;
  showDrawer('Fact',h,true);
  try{const o=await api('/api/table/laya_calls?'+new URLSearchParams({f_site_id:r.site_id,f_task:'fact_verify',q:r.text.slice(0,60),limit:40}));if(document.body.hasAttribute('data-open'))$('#votes').innerHTML=voteTable(o.rows.filter(x=>x.text&&r.text.startsWith(x.text.slice(0,40))))}catch(e){}
}
async function openSite(id,fromRow){
  let d;try{d=await api('/api/site/'+encodeURIComponent(id))}catch(e){toast(e.message);return}
  const t=d.track;if(!fromRow&&CUR)CUR.sel=-1;
  const tabs=[['facts',`Facts (${d.facts.filter(f=>f.review==='auto_good').length})`],['text','Text'],['pages',`Pages (${d.pages.length})`],['steps',`Steps (${d.incidents.length})`],['logos',`Logos (${d.logos.length})`]];
  const head=`<div class="answer"><b>${E(t.name||t.id)}</b><span class="st s-${E(t.status)}">${E(t.status)}</span></div>`+kv([['Site',`<a href="${E(t.final_url||t.url)}" target="_blank" rel="noopener">${E(t.final_url||t.url)}</a>`],['Outcome',E([t.class,t.reason].filter(Boolean).join(': ')||'–')],['Size',`${t.pages} pages, ${fnum(t.words)} words`],['Fetched with',E(t.rung||'–')+(t.tor_used?' through Tor':'')],['Attempts',t.attempts],['Took',fmtMs(t.elapsed_ms)]])+(t.error?`<pre>${E(t.error)}</pre>`:'');
  const body={
    facts:()=>{const g=d.facts.filter(f=>f.review==='auto_good');if(!g.length)return '<div class="dim">No facts were accepted for this site.</div>';const by={};g.forEach(f=>(by[f.category]??=[]).push(f));
      return Object.entries(by).map(([c,xs])=>`<div class="cat"><h5>${E((META.categories[c]||{}).label||c)}</h5>${xs.map(x=>`<p>${E(x.text)}${x.value?` <b>${E(x.value)}</b>`:''} <span class="faint">${E(x.votes)}</span></p>`).join('')}</div>`).join('')},
    text:()=>d.site?`<pre>${E(d.site.text||'')}</pre><div class="dim">Emails: ${E(d.site.found_emails||'–')}. Phones: ${E(d.site.found_phones||'–')}.</div>`:'<div class="dim">No text was stored for this site.</div>',
    pages:()=>`<table class="mini"><thead><tr><th>Page</th><th>HTTP</th><th class="r">Words</th></tr></thead><tbody>${d.pages.map(p=>`<tr><td><a href="${E(p.url)}" target="_blank" rel="noopener">${E(p.url)}</a></td><td>${p.http_status}</td><td class="num" style="text-align:right">${p.words}</td></tr>`).join('')}</tbody></table>`,
    steps:()=>`<table class="mini"><thead><tr><th>Time</th><th>Step</th><th>Outcome</th><th>Detail</th></tr></thead><tbody>${d.incidents.map(i=>`<tr><td class="dim">${E(fmtTime(i.at))}</td><td>${E(i.step)}</td><td>${E(i.outcome)}</td><td>${E(i.detail)}</td></tr>`).join('')}</tbody></table>`,
    logos:()=>d.logos.length?d.logos.map(l=>`<p>${l.local_path?`<img alt="" src="/logos/${encodeURIComponent(t.id)}/${E(l.local_path.split(/[\\/]/).pop())}" style="max-height:56px;max-width:160px;display:block;margin-bottom:4px">`:''}<span class="dim">${E(l.url)}</span><br>${l.is_logo?'Saved':'Skipped'}, found as ${E(l.source)}, laya ${l.laya_score==null?'–':Math.round(l.laya_score*100)+'%'} ${E(l.error||'')}</p>`).join(''):'<div class="dim">No logos.</div>'};
  const draw=k=>{$('#sbody').innerHTML=body[k]();document.querySelectorAll('#stabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k))};
  showDrawer(t.name||('Site '+t.id),head+`<div class="tabs" id="stabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-k="${k}">${l}</button>`).join('')}</div><div id="sbody"></div>`,fromRow);
  document.querySelectorAll('#stabs button').forEach(b=>b.onclick=()=>draw(b.dataset.k));draw('facts');
}

/* ---------------- boot ---------------- */
(async()=>{
  META=await api('/api/meta');META.tables.forEach(t=>TBL[t.name]=t);$('#cfgname').textContent=META.name;
  $('#mark').innerHTML=await (await fetch('/assets/mark-inline.svg')).text();
  ST=await api('/api/state');buildRail();applyState(ST);await route();
  setInterval(async()=>{if(document.hidden)return;try{ST=await api('/api/state');applyState(ST);if(CUR&&CUR.kind==='dash')dash()}catch(e){}},2500);
})();
</script>
